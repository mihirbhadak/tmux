<!--
  Source artwork for the 128x128 Marketplace icon (resources/icon.png).
  The Marketplace rejects SVG icons, so this is rasterized to PNG by hand
  (any SVG-to-PNG converter at 128x128) whenever the artwork changes.

  resources/icon.svg is a separate file: the monochrome Activity Bar glyph,
  which must stay 24x24 and use currentColor so VS Code can theme it.
-->
